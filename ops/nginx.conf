server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://api:3000;
    }

    # The app's static files can be cached; index.html must not be.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path (/login, /transactions/..., /pay/...)
    # is a client-side route served by index.html.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}

# Admin console (apps/admin) on its own port.
server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/admin;

    location /v1/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://api:3000;
    }

    # The app's static files can be cached; index.html must not be.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Admin console single-page app.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
